name: Test Logs for Errors

on:
  workflow_call:
    inputs:
      log-artifact-name:
        description: 'The name of the build artifact that contains the logs to test.'
        required: false
        type: string
        default: 'deployment-logs'
      log-file-name:
        description: 'The name of the filename in the artifact that contains the logs to test.'
        required: false
        type: string
        default: 'deployment_logs.txt'
      composer-version:
        description: 'Composer tools version pin. Defaults to 2.10.2.'
        required: false
        type: string
        default: '2.10.2'
      php-version:
        description: 'PHP version for setup-php. Defaults to 8.4; override to 8.3 for older toolchains.'
        required: false
        type: string
        default: '8.4'

jobs:
  test-logs:
    name: Check Deployment Logs for Errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      -
        name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:${{ inputs.composer-version }}
          extensions: curl,dom,gd,mbstring,posix,yaml,zip
      -
        name: Install dockworker
        run: composer install --prefer-dist --no-progress --no-suggest
        shell: bash
      -
        name: Retrieve The Log Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.log-artifact-name }}
          path: /tmp/logs
      -
        name: Check Logs for Errors
        env:
          LOG_FILE_NAME: ${{ inputs.log-file-name }}
        run: vendor/bin/dockworker logs:check-file "/tmp/logs/$LOG_FILE_NAME"
        shell: bash
      -
        name: Display Full Logs
        # Without this the step is skipped exactly when the check above fails,
        # which is the only time the logs are actually needed. The fallback keeps
        # a missing artifact from adding a second, misleading failure.
        if: always()
        env:
          LOG_FILE_NAME: ${{ inputs.log-file-name }}
        run: cat "/tmp/logs/$LOG_FILE_NAME" || echo "No log file at /tmp/logs/$LOG_FILE_NAME"
        shell: bash
