name: Build Image and Push, then Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      branch-env-map:
        description: 'A mapping of branches-to-k8s-namespaces. JSON dictionary format.'
        required: true
        type: string
      deploy-branches:
        description: 'A list of branches that should be deployed to kubernetes cluster. JSON list format.'
        required: true
        type: string
      k8s-deployment-name:
        description: 'The name(s) of the kubernetes deployment(s) to update. Supports CSV for multiple deployments (e.g., "deploy1,deploy2").'
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        required: true

jobs:
  deploy-image-to-k8s:
    if:
      contains(fromJSON(inputs.deploy-branches), github.ref_name)
    name: Deploy New Image to Kubernetes Cluster
    runs-on: ubuntu-latest
    steps:
      - uses: FranzDiebold/github-env-vars-action@v2
      -
        name: Retrieve Built Image Tag
        uses: actions/download-artifact@v8
        with:
          name: build-image-tag
          path: /tmp
      -
        name: Set Built Image Tag Locally
        run: cat /tmp/image_tag.env >> $GITHUB_ENV
      -
        name: Write Deployment Namespaces To Local
        run: echo '${{ inputs.branch-env-map }}' > /tmp/deployment_namespaces.json
      -
        name: Set Deployment Namespace
        run: echo "DEPLOYMENT_NAMESPACE=$(jq -r '.["${{ github.ref_name }}"]' /tmp/deployment_namespaces.json)" >> $GITHUB_ENV
      - uses: azure/setup-kubectl@v4
        name: Install Kubectl
        with:
          version: 'v1.31.0'
        id: install-kubectl
      - uses: azure/k8s-set-context@v4
        name: Set Kubectl Context
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
        id: setcontext-kubectl
      -
        name: Deploy Image to Kubernetes
        run: |
          FAILED_DEPLOYMENTS=""
          IFS=',' read -ra DEPLOYMENTS <<< "$DEPLOYMENT_NAMES"
          for DEPLOY_NAME in "${DEPLOYMENTS[@]}"; do
            DEPLOY_NAME=$(echo "$DEPLOY_NAME" | xargs)
            [ -z "$DEPLOY_NAME" ] && continue

            echo "::group::Deploying $DEPLOY_NAME"
            if ! (
              set -e
              kubectl set image "deployment/$DEPLOY_NAME" "$DEPLOY_NAME=$DEPLOYMENT_IMAGE" \
                --namespace="$DEPLOYMENT_NAMESPACE"

              ORIGINAL_REPLICAS=$(kubectl get deployment "$DEPLOY_NAME" \
                --namespace="$DEPLOYMENT_NAMESPACE" \
                -o jsonpath='{.metadata.annotations.downscaler/original-replicas}' || echo "")
              if [ -n "$ORIGINAL_REPLICAS" ]; then
                # In the case where a deployment wasn't scaled down YET, the scaling command is essentially a no-op but the TTL clock is reset.
                kubectl annotate deployment "$DEPLOY_NAME" \
                  deployment-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --namespace="$DEPLOYMENT_NAMESPACE" --overwrite
                kubectl scale deployment "$DEPLOY_NAME" \
                  --replicas=$ORIGINAL_REPLICAS --namespace="$DEPLOYMENT_NAMESPACE"
              fi

              kubectl rollout status deployment "$DEPLOY_NAME" \
                --namespace="$DEPLOYMENT_NAMESPACE"
            ); then
              echo "::error::Deployment of $DEPLOY_NAME failed!"
              FAILED_DEPLOYMENTS="$FAILED_DEPLOYMENTS $DEPLOY_NAME"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED_DEPLOYMENTS" ]; then
            echo "::error::The following deployments failed:$FAILED_DEPLOYMENTS"
            exit 1
          fi
        env:
          DEPLOYMENT_IMAGE: ${{ env.BUILD_IMAGE_FULL_NAME }}
          DEPLOYMENT_NAMES: ${{ inputs.k8s-deployment-name }}
          DEPLOYMENT_NAMESPACE: ${{ env.DEPLOYMENT_NAMESPACE }}
      -
        name: Write deployment logs
        if: always()
        run: |
          sleep 60
          IFS=',' read -ra DEPLOYMENTS <<< "$DEPLOYMENT_NAMES"
          for DEPLOY_NAME in "${DEPLOYMENTS[@]}"; do
            DEPLOY_NAME=$(echo "$DEPLOY_NAME" | xargs)
            [ -z "$DEPLOY_NAME" ] && continue
            if [ ${#DEPLOYMENTS[@]} -gt 1 ]; then
              echo "=== Logs for deployment/$DEPLOY_NAME ===" >> /tmp/deployment_logs.txt
            fi
            kubectl logs "deployment/$DEPLOY_NAME" \
              --namespace="$DEPLOYMENT_NAMESPACE" >> /tmp/deployment_logs.txt 2>&1
          done
        env:
          DEPLOYMENT_NAMES: ${{ inputs.k8s-deployment-name }}
          DEPLOYMENT_NAMESPACE: ${{ env.DEPLOYMENT_NAMESPACE }}
      -
        name: Archive Deployment Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-logs
          path: /tmp/deployment_logs.txt
          retention-days: 7
