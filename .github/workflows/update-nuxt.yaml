name: Update Nuxt Application and Dependencies

on:
  workflow_call:
    inputs:
      latest:
        description: 'Update to the latest versions, ignoring the ranges in package.json (pnpm update --latest). Defaults to staying within the declared ranges.'
        required: false
        type: boolean
        default: false
      node-version:
        description: 'Node.js version used to run pnpm.'
        required: false
        type: string
        default: '24'
      git-author:
        description: 'Author identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
      git-committer:
        description: 'Committer identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
    secrets:
      PAT_TOKEN:
        description: 'The token to use for creating the pull request'
        required: true

jobs:
  update-application:
    name: Update Application and Dependencies
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - name: Update Application and Dependencies
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          cat > "$RUNNER_TEMP/snapshot.js" <<'EOF'
          const [project] = JSON.parse(require('fs').readFileSync(0));
          const deps = { ...project.dependencies, ...project.devDependencies };
          console.log(JSON.stringify(Object.fromEntries(
            Object.entries(deps).map(([n, d]) => [n, d.version]),
          )));
          EOF
          cat > "$RUNNER_TEMP/compare.js" <<'EOF'
          const [before, after] = process.argv.slice(2).map((f) => require(f));
          const rows = Object.keys({ ...before, ...after }).sort()
            .filter((n) => before[n] !== after[n])
            .map((n) => `| ${n} | ${before[n] ?? '-'} | ${after[n] ?? '-'} |`);
          console.log(rows.length
            ? `| Package | From | To |\n|---|---|---|\n${rows.join('\n')}`
            : 'No direct dependency changes.');
          EOF

          # Scripts (nuxt prepare, husky) aren't needed to resolve dependencies.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm list --json --depth 0 | node "$RUNNER_TEMP/snapshot.js" > "$RUNNER_TEMP/before.json"
          if [ "$LATEST" = "true" ]; then
            pnpm update --latest --ignore-scripts
          else
            pnpm update --ignore-scripts
          fi
          pnpm list --json --depth 0 | node "$RUNNER_TEMP/snapshot.js" > "$RUNNER_TEMP/after.json"

          # The name@version keys of the lockfile's packages: section.
          lock_packages() {
            awk '/^packages:/ { p = 1; next } /^[^ ]/ { p = 0 } p && /^  [^ ]/' | sort
          }

          {
            printf 'Auto-generated by [dockworker][1]\n\n'
            node "$RUNNER_TEMP/compare.js" "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"
            printf '\nPackage versions added to pnpm-lock.yaml: %s\n' \
              "$(comm -13 <(git show HEAD:pnpm-lock.yaml | lock_packages) <(lock_packages < pnpm-lock.yaml) | wc -l)"
            printf '\n[1]: https://github.com/unb-libraries/dockworker/.github/workflows/update-nuxt.yaml\n'
          } > "$RUNNER_TEMP/body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: Update Application and Dependencies
          committer: ${{ inputs.git-committer }}
          author: ${{ inputs.git-author }}
          signoff: false
          branch: application-updates
          add-paths: |
            package.json
            pnpm-lock.yaml
          delete-branch: true
          title: 'Application Updates'
          body-path: ${{ runner.temp }}/body.md
          labels: |
            automated
            updates
          draft: false
