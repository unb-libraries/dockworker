name: Run unit tests

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version for setup-php. Defaults to 8.3 for backward compatibility.'
        required: false
        type: string
        default: '8.3'
      composer-version:
        description: 'Composer tools version pin. Defaults to 2.8.4 for backward compatibility.'
        required: false
        type: string
        default: '2.8.4'

jobs:
  test-unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      -
        name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
      -
        name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:${{ inputs.composer-version }}
          extensions: curl,dom,gd,mbstring,posix,yaml,zip
      - 
        name: Install dockworker
        run: composer install
        shell: bash
      -
        name: Install test dependencies
        run: npm install
        shell: bash
      - 
        name: Run tests
        run: export && vendor/bin/dockworker test:unit --no-interaction
        shell: bash