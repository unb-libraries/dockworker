name: Update CKEditor 5 Modules

on:
  workflow_call:
    inputs:
      module-dirs:
        description: 'Optional newline-delimited list of module directories to update. When empty, every custom/modules/* directory with a yarn.lock and a ckeditor5 dependency in its package.json is updated.'
        required: false
        type: string
        default: ''
      composer-lock:
        description: 'Path to the composer lock file used to determine the Drupal core version (and therefore its ckeditor5 version).'
        required: false
        type: string
        default: 'build/composer.lock'
      node-version:
        description: 'Node.js version used to install and build the modules.'
        required: false
        type: string
        default: '24'
      git-author:
        description: 'Author identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
      git-committer:
        description: 'Committer identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
    secrets:
      PAT_TOKEN:
        description: 'The token to use for creating the pull request'
        required: true

jobs:
  update-ckeditor5-modules:
    name: Update CKEditor 5 Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      # Modules build their plugins against core's CKEditor 5 DLL, so ckeditor5
      # is pinned to the range the site's Drupal core ships.
      - name: Determine Core CKEditor 5 Version
        id: core
        env:
          COMPOSER_LOCK: ${{ inputs.composer-lock }}
        run: |
          CORE_VERSION=$(sed -n '/"name": "drupal\/core",/{n;p;q}' "$COMPOSER_LOCK" | cut -d'"' -f4)
          CKEDITOR_RANGE=$(curl -sfL "https://git.drupalcode.org/project/drupal/-/raw/${CORE_VERSION}/core/package.json" \
            | grep '"ckeditor5":' | cut -d'"' -f4)
          if [ -z "$CORE_VERSION" ] || [ -z "$CKEDITOR_RANGE" ]; then
            echo "::error::Unable to determine core's ckeditor5 version (core: ${CORE_VERSION:-unknown})."
            exit 1
          fi
          echo "core-version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ckeditor-range=$CKEDITOR_RANGE" >> "$GITHUB_OUTPUT"

      - name: Update and Rebuild Modules
        id: update
        env:
          MODULE_DIRS: ${{ inputs.module-dirs }}
          CORE_VERSION: ${{ steps.core.outputs.core-version }}
          CKEDITOR_RANGE: ${{ steps.core.outputs.ckeditor-range }}
        run: |
          if [ -n "$MODULE_DIRS" ]; then
            DIRS="$MODULE_DIRS"
          else
            DIRS=$(for f in custom/modules/*/package.json; do
              d=$(dirname "$f")
              [ -f "$d/yarn.lock" ] && grep -q '"ckeditor5"' "$f" && echo "$d"
            done || true)
          fi
          if [ -z "$DIRS" ]; then
            echo "::error::No CKEditor 5 modules found."
            exit 1
          fi

          cat > "$RUNNER_TEMP/snapshot.js" <<'EOF'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json'));
          const deps = Object.keys({ ...p.dependencies, ...p.devDependencies });
          console.log(JSON.stringify(Object.fromEntries(deps.map((n) => [
            n, JSON.parse(fs.readFileSync(`node_modules/${n}/package.json`)).version,
          ]))));
          EOF
          cat > "$RUNNER_TEMP/compare.js" <<'EOF'
          const [before, after] = process.argv.slice(2).map((f) => require(f));
          const rows = Object.keys({ ...before, ...after }).sort()
            .filter((n) => before[n] !== after[n])
            .map((n) => `| ${n} | ${before[n] ?? '-'} | ${after[n] ?? '-'} |`);
          console.log(rows.length
            ? `| Package | From | To |\n|---|---|---|\n${rows.join('\n')}`
            : 'No direct dependency changes.');
          EOF

          BODY="$RUNNER_TEMP/body.md"
          printf 'Auto-generated by [dockworker][1]\n\nDrupal core %s uses ckeditor5 `%s`.\n' "$CORE_VERSION" "$CKEDITOR_RANGE" > "$BODY"
          ADD_PATHS=""
          for DIR in $DIRS; do
            DIR="${DIR%/}"
            echo "::group::Updating $DIR"
            TMP="$RUNNER_TEMP/$(basename "$DIR")"
            (
              cd "$DIR"
              yarn install --frozen-lockfile --non-interactive
              node "$RUNNER_TEMP/snapshot.js" > "$TMP.before.json"
              npm pkg set "devDependencies.ckeditor5=$CKEDITOR_RANGE"
              yarn install --non-interactive
              yarn upgrade --non-interactive
              yarn build
              node "$RUNNER_TEMP/snapshot.js" > "$TMP.after.json"
            )
            echo "::endgroup::"

            {
              printf '\n### %s\n\n' "$DIR"
              node "$RUNNER_TEMP/compare.js" "$TMP.before.json" "$TMP.after.json"
              printf '\nTransitive package versions changed in yarn.lock: %s\n\n' \
                "$(git diff -U0 -- "$DIR/yarn.lock" | grep -c '^+  version' || true)"
              if [ -n "$(git status --porcelain -- "$DIR/js/build")" ]; then
                echo 'Plugin build output (`js/build`) **changed**.'
              else
                echo 'Plugin build output (`js/build`) unchanged.'
              fi
            } >> "$BODY"
            ADD_PATHS="$ADD_PATHS$DIR/package.json"$'\n'"$DIR/yarn.lock"$'\n'"$DIR/js/build"$'\n'
          done
          printf '\n[1]: https://github.com/unb-libraries/dockworker/.github/workflows/update-ckeditor5.yaml\n' >> "$BODY"

          {
            echo 'add-paths<<EOF'
            printf '%s' "$ADD_PATHS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: Update CKEditor 5 Modules
          committer: ${{ inputs.git-committer }}
          author: ${{ inputs.git-author }}
          signoff: false
          branch: ckeditor5-module-updates
          add-paths: ${{ steps.update.outputs.add-paths }}
          delete-branch: true
          title: 'CKEditor 5 Module Updates'
          body-path: ${{ runner.temp }}/body.md
          labels: |
            automated
            updates
          draft: false
