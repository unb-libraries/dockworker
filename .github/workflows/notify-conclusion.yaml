name: Send Notifications Announcing Workflow Conclusion

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  slack-results:
    name: Notify of Conclusion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
      - name: Build Slack payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          CONCLUSION: ${{ env.WORKFLOW_CONCLUSION }}
        run: |
          COMMIT_JSON=$(gh api "repos/${REPO}/commits/${SHA}" 2>/dev/null || echo '{}')
          MESSAGE=$(jq -r '.commit.message // ""' <<<"$COMMIT_JSON")
          AUTHOR=$(jq -r '.commit.author.name // ""' <<<"$COMMIT_JSON")
          [ -z "$AUTHOR" ] && AUTHOR="$ACTOR"
          SHORT_SHA=${SHA:0:7}
          case "$CONCLUSION" in
            success) COLOR="good";    EMOJI=":rocket:" ;;
            failure) COLOR="danger";  EMOJI=":boom:" ;;
            *)       COLOR="warning"; EMOJI=":boom:" ;;
          esac
          TEXT=$(printf '%s %s - %s %s (%s)\n%s %s\n%s' \
            "$REPO" "$REF_NAME" "$CONCLUSION" "$EMOJI" "$WORKFLOW" "$SHORT_SHA" "$MESSAGE" "$AUTHOR")
          PAYLOAD=$(jq -cn --arg color "$COLOR" --arg text "$TEXT" \
            '{attachments: [{color: $color, text: $text}]}')
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true           # terminal job: fail loudly so broken payloads/webhook are visible
          payload: ${{ steps.payload.outputs.json }}
