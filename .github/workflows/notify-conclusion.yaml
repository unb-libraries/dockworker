name: Send Notifications Announcing Workflow Conclusion

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  slack-results:
    name: Notify of Conclusion
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Build Slack payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Aggregate this run's job results (replaces technote-space/workflow-conclusion-action,
          # which is stuck on Node 16). A reusable workflow can't see sibling job results directly,
          # so query the run's jobs via the API. On lookup failure, fall back to "unknown" (renders
          # as a warning) rather than falsely reporting success.
          CONCLUSIONS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate --jq '.jobs[].conclusion' 2>/dev/null || true)
          if [ -z "$CONCLUSIONS" ]; then
            CONCLUSION="unknown"
          elif grep -qE '^(failure|timed_out)$' <<<"$CONCLUSIONS"; then
            CONCLUSION="failure"
          elif grep -q '^cancelled$' <<<"$CONCLUSIONS"; then
            CONCLUSION="cancelled"
          else
            CONCLUSION="success"
          fi
          COMMIT_JSON=$(gh api "repos/${REPO}/commits/${SHA}" 2>/dev/null || echo '{}')
          MESSAGE=$(jq -r '.commit.message // ""' <<<"$COMMIT_JSON")
          AUTHOR=$(jq -r '.commit.author.name // ""' <<<"$COMMIT_JSON")
          [ -z "$AUTHOR" ] && AUTHOR="$ACTOR"
          SHORT_SHA=${SHA:0:7}
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}"
          case "$CONCLUSION" in
            success) COLOR="good";    EMOJI=":rocket:" ;;
            failure) COLOR="danger";  EMOJI=":boom:" ;;
            *)       COLOR="warning"; EMOJI=":boom:" ;;
          esac
          # Slack mrkdwn <url|text> links: workflow name -> this run, short SHA -> the commit.
          TEXT=$(printf '%s %s - %s %s (<%s|%s>)\n<%s|%s> %s\n%s' \
            "$REPO" "$REF_NAME" "$CONCLUSION" "$EMOJI" "$RUN_URL" "$WORKFLOW" "$COMMIT_URL" "$SHORT_SHA" "$MESSAGE" "$AUTHOR")
          PAYLOAD=$(jq -cn --arg color "$COLOR" --arg text "$TEXT" \
            '{attachments: [{color: $color, text: $text, mrkdwn_in: ["text"]}]}')
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true           # terminal job: fail loudly so broken payloads/webhook are visible
          payload: ${{ steps.payload.outputs.json }}
