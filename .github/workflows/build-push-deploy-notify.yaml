name: Build Image and Push, then Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      branch-env-map:
        description: 'A mapping of branches-to-k8s-namespaces. JSON dictionary format.'
        required: true
        type: string
      build-themes:
        description: 'Whether or not to build application themes using dockworker before building the image.'
        required: false
        type: boolean
        default: false
      deploy-branches:
        description: 'A list of branches that should be deployed to kubernetes cluster. JSON list format.'
        required: true
        type: string
      image-name:
        description: 'The full, repository namespaced image name to build (without the tag).'
        required: true
        type: string
      k8s-deployment-name:
        description: 'The name(s) of the kubernetes deployment(s) to update. Supports CSV for multiple deployments (e.g., "deploy1,deploy2").'
        required: true
        type: string
      # DEPRECATED (remove in 7.x): retained for backward compatibility; ignored and
      # forwarded to build-push, which now tags every branch by name automatically.
      push-branches:
        description: 'DEPRECATED and ignored. All branches are now tagged by branch name automatically; remove this from your workflow call.'
        required: false
        type: string
        default: '[]'
      platforms:
        description: "A comma-separated list of platforms."
        required: false
        type: string
        default: linux/amd64,linux/arm64/v8
      docker-build-record-retention-days:
        description: 'Number of days to retain Docker build records.'
        required: false
        type: number
        default: 3
      php-version:
        description: 'PHP version for setup-php in sub-workflows. Defaults to 8.3 for backward compatibility.'
        required: false
        type: string
        default: '8.3'
      composer-version:
        description: 'Composer tools version pin in sub-workflows. Defaults to 2.8.4 for backward compatibility.'
        required: false
        type: string
        default: '2.8.4'
    secrets:
      KUBE_CONFIG:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GH_CONTAINER_REGISTRY_USER:
        required: true
      GH_CONTAINER_REGISTRY_TOKEN:
        required: true

jobs:
  notify-start:
    name: Notify Start
    if: always()
    uses: unb-libraries/dockworker/.github/workflows/notify-start.yaml@6.x
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-push-images:
    name: Build/Push Images
    uses: unb-libraries/dockworker/.github/workflows/build-push.yaml@6.x
    with:
      build-themes: ${{ inputs.build-themes }}
      image-name: ${{ inputs.image-name }}
      push-branches: ${{ inputs.push-branches }}
      platforms: ${{ inputs.platforms }}
      docker-build-record-retention-days: ${{ inputs.docker-build-record-retention-days }}
      php-version: ${{ inputs.php-version }}
      composer-version: ${{ inputs.composer-version }}
    secrets:
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}

  deploy-image-to-k8s:
    name: Deploy New Image
    uses: unb-libraries/dockworker/.github/workflows/deploy.yaml@6.x
    needs: [ build-push-images ]
    with:
      branch-env-map: ${{ inputs.branch-env-map }}
      deploy-branches: ${{ inputs.deploy-branches }}
      k8s-deployment-name: ${{ inputs.k8s-deployment-name }}
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

  test-new-deployment-logs:
    name: Check New Deployment Logs
    uses: unb-libraries/dockworker/.github/workflows/test-logs.yaml@6.x
    needs: [ deploy-image-to-k8s ]

  prune-old-images:
    name: Prune Old Images
    needs: [ deploy-image-to-k8s ]
    if: ${{ success() && contains(fromJSON(inputs.deploy-branches), github.ref_name) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: prune-${{ inputs.image-name }}
      cancel-in-progress: false
    steps:
      - uses: unb-libraries/container-image-pruner@v1
        with:
          image-name: ${{ inputs.image-name }}
          token: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
          max-delete: 1500

  notify-conclusion:
    name: Notify Conclusion
    uses: unb-libraries/dockworker/.github/workflows/notify-conclusion.yaml@6.x
    needs: [ test-new-deployment-logs ]
    if: always()
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
